name: Auto-merge Dependabot PRs

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Auto-merge patch and minor updates
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# GITHUB_TOKEN is automatically available in every GitHub Actions workflow at no cost — GitHub injects it for you, no setup required. It's not something you create or pay for; it just exists as ${{ secrets.GITHUB_TOKEN }} in any workflow. GitHub Actions itself is also free for public repos, and free up to 2,000 minutes/month for private repos on the free plan — so this whole setup costs nothing for most use cases.
